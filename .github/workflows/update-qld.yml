name: Update Data for QLD

on:
  schedule:
    - cron: '23 02 21,28 2,5,8,11 *'
  workflow_dispatch:

jobs:
  call-reusable-workflow:
    # ADR 034/035/041: target=v4 → OIDC/SigV4. id-token:write MUST be granted here on
    # the caller — a reusable workflow's id-token is capped by the caller's
    # token (verified via the OT caller-chain canary 2026-07-11).
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/reusable-update.yml
    secrets:
      TF_VAR_ELASTIC_V4_HOST: ${{ secrets.TF_VAR_ELASTIC_V4_HOST }}
    with:
      state: QLD
      target: v4
