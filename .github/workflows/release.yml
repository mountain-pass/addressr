name: Release

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  # RETIRED 2026-08-10 — the `deploy_only` boolean input lived here.
  #
  # ADR-045 supersedes it: a production infrastructure apply is now armed by a
  # committed changeset for `apps/addressr-deployment`, and merging the release
  # PR is the apply. User-directed — "I don't want it being a flag that the
  # agent has to provide from our local machine. The change sets should
  # determine what does and doesn't trigger and deploy."
  #
  # DELETED RATHER THAN LEFT DECLARED, deliberately. Repointing the deploy gate
  # while leaving the input in place would have made a `deploy_only=true`
  # dispatch skip the publish, skip the P044 assertion, skip Deploy/Wait/Smoke
  # — and conclude GREEN. A fully inert production-deploy affordance reporting
  # success is the silent-green class ADR-045 exists to prevent. With the input
  # gone, GitHub rejects the dispatch outright, which is the loud failure.
  #
  # `workflow_dispatch` itself is retained with no inputs: a plain dispatch runs
  # the build and test tiers, which is useful and arms nothing.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  check-deps:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm ci
      - name: Check for mature dependency updates
        run: npx dry-aged-deps --check

  # `engines.node` is `>=22` and scripts/check-version.js enforces that floor at
  # postinstall with a process.exit(1), so the bottom of that range is SUPPORTED
  # for self-hosted operators rather than merely tolerated. Every other job here
  # runs `22.x`, which floats to latest, so the bottom was exercised by nothing.
  #
  # The gap has teeth: service/gnaf-directory.js uses `fs/promises` glob, which
  # Node marks experimental across 22.0-22.16 and supported from 22.17. The
  # loader depends on its trailing-slash pattern restricting matches to
  # directories, and that is undocumented for the built-in. Measured identical
  # on 22.0.0, 22.16.0, 22.17.1 and 24.16; this leg keeps it measured instead of
  # leaving it a one-off check.
  #
  # WHY 22.7 AND NOT 22.0, which is what `engines` actually declares. The .mjs
  # tests import untranspiled `.js` service modules, and ESM-in-.js only loads
  # from 22.7 where module syntax detection landed. On 22.0 the suite reports 92
  # failures, all of that one cause and none of them real.
  #
  # AMENDED 2026-08-08 (ADR-044): the original note said "shipped code is
  # unaffected — babel emits CJS into lib/". Babel is gone and source ships
  # directly, so that reason is void. The FLOOR still stands, for a narrower
  # reason: `"type": "module"` makes every .js unambiguously ESM, so syntax
  # detection is no longer load-bearing and 22.0 would likely pass — but this
  # leg exists to cover the experimental-glob range, and lowering it has not
  # been measured. 22.7 is the lowest
  # version that can run the suite at all, and it still sits inside the
  # experimental-glob range this leg exists to cover.
  #
  # No OpenSearch and no G-NAF fixture, so it is cheap.
  engine-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # R028 review-fence invariant keys on `git log` commit order. Under
          # the default fetch-depth: 1 every lookup returns empty, the check
          # compares 0 < 0 for every pair and passes having done no work.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.7.x'
      - name: Install dependencies
        run: npm ci
      - name: Unit tests on the declared engine floor
        run: npm run test:js

      # P106: the licence gate previously lived ONLY in the local pre-commit
      # hook, which --no-verify bypasses and CI never ran. A compliance control
      # that exists only on a developer's machine is not a control. It runs here
      # because this job already installs the tree it audits.
      - name: Licence audit of the published production tree
        run: npm run check-licenses

  # The website's behavioural test tier (ADR-053).
  #
  # WHY IT IS ITS OWN JOB. These assertions read Gatsby's EMITTED output —
  # rendered HTML and bundles — not JSX source. That needs a build, which costs
  # ~23s and produces `apps/website/public`, a gitignored directory that exists
  # in no other job. Putting them in `test:js` would fail everywhere that does
  # not build, or force a skip-when-missing that passes having examined nothing.
  #
  # WHY BEHAVIOURAL AT ALL. The first version grepped JSX. P033's population
  # guard reddened on it immediately — that ticket exists because source pins
  # stand in for behaviour and once hid a production defect for four months.
  # Source greps also cannot see what actually breaks these pages: a mailto
  # resolved as a site-relative path by Gatsby's Link, a deleted route still
  # linked, or a credential inlined into a bundle. All three are asserted here.
  #
  # ADR-060 makes this a prerequisite of the release job. The same workflow
  # later rebuilds only when a consumed website changeset arms direct upload;
  # this earlier job is the independent behavioural gate over emitted output.
  # A red therefore blocks the release PR merge before either Terraform or the
  # website can reach production.
  website-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm ci
      - name: Build the website
        run: npm run build -w @mountainpass/website
      - name: Behavioural assertions over the built site
        run: npm run test:website
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Scripted Chromium keyboard interactions only — not full accessibility conformance
        run: npm run test:browser -w @mountainpass/website
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opensearch_version: ['2.19.5', '3.5.0']
    services:
      opensearch:
        image: opensearchproject/opensearch:${{ matrix.opensearch_version }}
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: '-Xms1g -Xmx1g'
          plugins.security.disabled: 'true'
          # Required for OpenSearch 2.12+ to skip the demo-config installer when
          # the security plugin is disabled. Without this, the 2.x entrypoint
          # bails out demanding OPENSEARCH_INITIAL_ADMIN_PASSWORD even though
          # plugins.security.disabled is set.
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          # R028 review-fence invariant keys on `git log` commit order. Under
          # the default fetch-depth: 1 every lookup returns empty, the check
          # compares 0 < 0 for every pair and passes having done no work.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-
      - name: Install dependencies
        run: npm ci
      - name: Cache G-NAF zip
        uses: actions/cache@v6
        id: gnaf-cache
        with:
          path: target/gnaf/*.zip
          key: gnaf-zip-${{ hashFiles('packages/addressr/service/address-service.js') }}
          restore-keys: |
            gnaf-zip-
      - name: Prepare OT test fixture
        run: |
          # Download G-NAF if not cached. Native ESM since ADR-044 — no build,
          # no @babel/register hook; the source is what runs.
          if [ ! -f target/gnaf/*.zip ]; then
            node --input-type=module -e "
              const { fetchGnafFile } = await import('./packages/addressr/service/address-service.js');
              console.log('Downloaded:', await fetchGnafFile());
            "
          fi
          # Extract only OT + Authority Code files into a slim fixture
          GNAF_ZIP=$(ls target/gnaf/*.zip | head -1)
          FIXTURE_DIR=target/gnaf-fixture
          mkdir -p "$FIXTURE_DIR"
          unzip -o -j "$GNAF_ZIP" '*/Authority Code/*' -d "$FIXTURE_DIR/Authority Code/" 2>/dev/null || true
          unzip -o -j "$GNAF_ZIP" '*/Standard/OT_*' -d "$FIXTURE_DIR/Standard/" 2>/dev/null || true
          echo "Fixture contents:"
          find "$FIXTURE_DIR" -type f | head -20
      # Structural pins on the CI/workflow surface itself — the loader
      # caller/callee secret contract, the terraform-plan guard, the deploy-only
      # release path, the docker and perf workflows. These ran only from the
      # pre-commit hook until 2026-08-02, where --no-verify bypasses them and a
      # GitHub-UI edit never touches them at all. The loader pin in particular
      # guards a contract whose breakage is otherwise invisible until a
      # QUARTERLY cron fires, so hook-only enforcement was the wrong tier for it.
      - name: Workflow and unit pins
        run: npm run test:js
      # ADR-041 / P069: the partial-prefix superset property, asserted against a
      # real engine on BOTH matrix legs. It builds its index from the exported
      # builders, so the asserted config cannot drift from production's.
      # CI is set here, so the test FAILS rather than skips if OpenSearch is
      # unreachable — a silently-skipped test discharges neither half of the
      # ADR-041 confirmation criterion.
      - name: Search analysis integration (ADR-041)
        env:
          ELASTIC_TEST_HOST: http://localhost:9200
        run: npm run test:integration:search
      - name: Run tests (no geo)
        env:
          GNAF_TEST_FIXTURE_DIR: target/gnaf-fixture
        run: npm run test:nogeo
      - name: Run tests (geo)
        env:
          GNAF_TEST_FIXTURE_DIR: target/gnaf-fixture
        # ADDRESSR_ENABLE_GEO=1 matches the production EB env at deploy/main.tf
        # so this step closes the previous coverage gap where the geo code
        # path (loadSiteGeo / loadDefaultGeo) only ran in production. No
        # external API: geo data comes from the G-NAF dataset itself, so the
        # OT fixture above is sufficient.
        run: npm run test:geo

  # ADR-058: every public package imported into this repository must be built,
  # tested and packed before Changesets can publish it.
  workspace-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Install dependencies
        run: npm ci
      - name: Lint, test and build the five imported workspaces
        run: npx turbo run lint test build --filter='./packages/addressr-*'
      - name: Verify packed files and module entry points
        run: npm run check:workspace-packages
      - name: Live RapidAPI package integrations
        env:
          ADDRESSR_RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          if [ -z "$ADDRESSR_RAPIDAPI_KEY" ]; then
            echo "::notice::UNAVAILABLE: RAPIDAPI_KEY is not available to this run; live package integrations were not exercised."
            exit 0
          fi
          npm run test:integration -w @mountainpass/addressr-core
          npm run test:integration -w @mountainpass/addressr-mcp

  release:
    if: github.ref == 'refs/heads/master'
    needs: [build-and-test, engine-floor, website-build, workspace-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Docker publication is an effect of the API package, not of any npm
    # publication. This job output carries that package-scoped result to the
    # reusable docker job below.
    outputs:
      api-published: ${{ steps.release-effects.outputs.api-published }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - uses: actions/checkout@v5
        with:
          # changesets/action wants full history for changelog attribution.
          #
          # RE-POINTED TWICE ON 2026-08-10, and the history is worth keeping
          # because the reason went void and then came back stronger.
          #
          # It first LED with the retired path-detection step (full history
          # needed because a push can carry several commits), with changelog
          # attribution as an afterthought. When that step was retired the
          # leading reason went void and only the afterthought survived.
          #
          # ADR-045's detection step REVIVES it, and more strongly than the
          # retired step did. That step diffed paths; this one resolves two refs
          # by SHA — `git cat-file -e` on `github.event.before`, then `git show`
          # against both refs. An insufficient depth now makes the before-ref
          # unreachable, which the script treats as a DENIAL: a silent no-deploy
          # rather than the old silent over-deploy. Fail-closed, but silent
          # either way, so the depth is load-bearing.
          #
          # Leading reason: ADR-045 version-bump detection. Secondary: changelog
          # attribution, which still holds on its own.
          fetch-depth: 0
          # changesets/action writes the scoped GH_TOKEN below to .netrc. Do
          # not let checkout's read-only github.token override it for tag pushes.
          persist-credentials: false
      - name: Install dependencies
        run: |
          npm ci

      # RETIRED 2026-08-10 — the ADR-040 stage-3 deploy/** push axis.
      #
      # A step here used to diff `github.event.before` against the pushed head
      # over `deploy/` and, on any hit, arm the deploy gate below. That made a
      # routine `git push` the cheapest of three routes to a production apply,
      # at push-tier governance with no plan-approval gate — the hazard R021
      # carried and ADR-001's 2026-07-27 amendment authorised.
      #
      # WHY IT WENT, and it is not the reason ADR-040's own reassessment
      # entertained. On 2026-08-08 that criterion fired (run 31252424980, P095)
      # and was answered `no, the axis should not require the dispatch after all
      # — it is made safe one layer down`. That answer still stands on its own
      # terms; the P095 remediation did not fail. What retires the axis is a
      # different fact: the predicate diffed a PATH, and a rename OUT of
      # `deploy/` shows as deletions under `deploy/`. Moving the tree into
      # `apps/addressr-deployment/` would therefore have set changed=true and applied
      # Terraform to production as a rider on a pure refactor. Verified by
      # replaying this exact predicate against a real `git mv`, not reasoned
      # about. ADR-044 hit the same shape and held
      # `deploy/create-deployment-archive.js` out of the ESM change for it.
      #
      # Do not re-add it. The successor entry point is the changesets release
      # PR: an infra change carries a changeset for the deployment package, and
      # merging that PR is the apply.
      #
      # TRUE AS OF 2026-08-10 — this note recorded the interim and the interim is
      # over. It read "NOT TRUE YET, as of Phase 2": the deployment package
      # existed and took changesets, but the gate still keyed on `published` and
      # `deploy_only`, so a release PR carrying ONLY a deployment-package
      # changeset versioned the package, published nothing (it is
      # `private: true`, so `changeset publish` skips it) and SKIPPED Deploy,
      # Stabilise and Smoke on a green run.
      #
      # The gate now keys on that package's version bump — see the detection
      # step below — so a deployment-only changeset reaches production, and
      # `deploy_only` is deleted rather than left inert. Pinned by
      # test/js/__tests__/release-workflow-deploy-only.test.mjs, which asserts
      # the retired step's id occurs nowhere in this file — the detection step
      # re-added ALONE would read as harmless in review and sit one character
      # from live. That assertion is why this note spells the id out nowhere,
      # including here: a comment naming it would satisfy the raw scan and
      # defeat the pin.

      # ADR-045: does this push arm a production infrastructure apply?
      #
      # The logic lives in a script rather than inline BECAUSE ADR-045
      # confirmation criterion 3 requires it be DRIVEN through a rename, an
      # all-zeros before-ref, an unreachable parent and a non-push event. An
      # inline `run:` block can only be asserted for its shape; a script can be
      # executed against real git fixtures, which is what
      # test/js/__tests__/detect-deployment-bump.test.mjs does.
      #
      # It compares the deployment package's version VALUE at
      # `github.event.before` and HEAD — never a path diff. A path diff reports
      # a RENAME as a change and would arm a production apply on a pure
      # refactor, which is the defect that retired the predecessor axis.
      #
      # `if: github.event_name == 'push'` is the non-push leg: on any other
      # event the step is skipped, `outputs.changed` is the empty string, and
      # the gate's POSITIVE `== 'true'` comparison is therefore false. The
      # positive form is load-bearing — the empty-string trap bites the negated
      # `!= 'true'` form, not this one. The script denies on an empty argument
      # too, so the property does not rest on this condition alone.
      #
      # BOUND TO THE PUSHED SHA, NOT THE WORKING HEAD — load-bearing, and the
      # reason is a defect this very step shipped with before review caught it.
      # `changesets/action` takes the runVersion path on a push carrying
      # changesets: it checks out `changeset-release/master`, runs
      # `changeset version`, commits, and does NOT switch back. So after that
      # step `HEAD` is the version-bump commit — deployment version already
      # bumped, changesets already deleted. A detector reading `HEAD` would
      # arm on the SECOND and every subsequent changeset-bearing push of a
      # release cycle: an unreviewed production apply at push-tier, before the
      # release PR is even merged. That is the hazard the `deploy/**` axis was
      # retired for, on a wider trigger.
      #
      # Two independent fixes, both applied so the property survives a future
      # step reorder: this step runs ABOVE the changesets step, and it passes
      # `github.sha` explicitly rather than defaulting to `HEAD`. Both are
      # pinned in test.
      #
      # This needs `fetch-depth: 0` above: it reads two refs by SHA.
      - name: Detect a deployment version bump
        id: deployment-version
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          PUSHED: ${{ github.sha }}
        run: scripts/detect-deployment-bump.sh "$BEFORE" "$PUSHED" >> "$GITHUB_OUTPUT"

      - name: Detect a website version bump
        id: website-version
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          PUSHED: ${{ github.sha }}
        run: scripts/detect-deployment-bump.sh "$BEFORE" "$PUSHED" apps/website/package.json >> "$GITHUB_OUTPUT"

      - name: Use the trusted-publishing toolchain
        run: |
          npm install --global npm@11.13.0
          npx --no-install semver "$(node --version)" -r '>=22.14.0'
          npx --no-install semver "$(npm --version)" -r '>=11.5.1'

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        # UNGATED since 2026-08-10. This carried `if: inputs.deploy_only != true`
        # to keep a deploy-only dispatch off the registry; that input is retired
        # (see the note at `workflow_dispatch` above), so there is no longer a
        # path that must skip this step.
        uses: changesets/action@v1.9.0
        with:
          publish: npm run turbo:ci:publish
          version: npm run turbo:ci:version
          commit: 'chore: release'
          title: 'chore: release'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # P044 / RFC-002: changesets/action can report a partial or swallowed
      # publish without failing. Once there are no changesets left to version,
      # every public workspace must match npm exactly. This covers all packages,
      # including a partial multi-package publish.
      - name: Fail if a publish was expected but did not happen (P044)
        # hasChangesets=true means the action created or updated the release PR;
        # local versions are expected to be ahead until that PR merges.
        if: always() && steps.changesets.outputs.hasChangesets != 'true'
        run: node scripts/check-workspace-publications.mjs

      # Resolve effects only after publication verification. docker-publish uses
      # !cancelled(), so exporting this earlier could publish an API image after
      # the registry assertion failed.
      - name: Resolve package-scoped release effects
        id: release-effects
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node scripts/release-effects.mjs "$PUBLISHED" "$PUBLISHED_PACKAGES" >> "$GITHUB_OUTPUT"

      # P039 / ADR 001 amendment 2026-07-26: SINGLE DEFINITION.
      # The deploy path has exactly one set of steps, shared by every entry
      # point — the API-package publish path and the changesets-armed deployment version bump
      # (ADR-045). Two earlier entry points are gone: ADR-040 stage 3's `deploy/**`
      # infra axis (retired — see the note where its detection step used to sit)
      # and the `deploy_only` dispatch it left as the sole route (superseded by
      # ADR-045 and deleted, not left inert). Never fork this into a second job or
      # duplicate these steps: divergence between the prod-deploy paths is the
      # failure this shared gate exists to prevent, and the master-HEAD-only job
      # guard above is what keeps every entry point on the same source. Each
      # change to the entry-point set is an `if:` edit on this one gate, never a
      # new copy of it — and that holds for NARROWING, as here, exactly as it
      # held for the two widenings before it.
      #
      # `success() && (...)` is explicit on purpose. The second disjunct reads a
      # step output that is set independently of whether the publish succeeded,
      # so without `success()` the deploy would rest on GitHub's implicit
      # default and could run after an upstream failure. (It carried the same
      # note when that disjunct was the `deploy_only` constant; the reason
      # survives the substitution, which is why it is restated rather than
      # dropped.) The PARENTHESES
      # are load-bearing: `&&` binds tighter than `||`, so `success() && A || B`
      # would deploy after an upstream failure.
      - name: Deploy new version
        if: success() && (steps.release-effects.outputs.api-published == 'true' || steps.deployment-version.outputs.changed == 'true')
        uses: devcontainers/ci@v0.3
        # P095: tell deploy.sh that a publish just happened on THIS run, so it
        # ships the workspace version rather than reading the registry.
        #
        # On this path the workspace version IS the version changesets just
        # published — correct by construction, no race. A registry read here
        # could return the PREVIOUS version, because `npm view` is a CDN-served
        # read of the `latest` dist-tag and `npm publish` returning does not
        # guarantee an edge read reflects it yet. That would deploy the wrong
        # version green and silent, which is worse than the loud failure P095
        # records.
        #
        # Only this disjunct gets the signal. The deployment-version-bump
        # disjunct resolves from the registry instead, which is what makes the
        # deployment manifest satisfiable — that is the P095 fix, and it is what
        # the user directed: "The deploy path MUST take the last published
        # version." (Two predecessors shared that registry path: the retired
        # `deploy/**` push, which was the axis P095 was actually about because it
        # could fire while a release was pending and deploy a version that was
        # never published; and the `deploy_only` dispatch, deleted 2026-08-10.
        # Neither survives, but the split does, because the publish path still
        # must NOT read the registry for the CDN-staleness reason above.)
        # Omitting the
        # signal falls back to the registry, so forgetting it fails safe.
        env:
          ADDRESSR_DEPLOY_JUST_PUBLISHED: ${{ steps.release-effects.outputs.api-published == 'true' && '1' || '0' }}
          # ADR 029/033/034: v1 basic-auth creds (TF_VAR_elastic_host/username/
          # password) and the v2 master-user creds (TF_VAR_elastic_v2_username/
          # password) were removed 2026-07-11 — FGAC is off (SigV4), the EB app
          # sources ELASTIC_HOST from module.opensearch_v2.endpoint, and v1 is
          # decommissioned. No search-domain credential vars remain.
          TF_VAR_aws_secret_key: ${{ secrets.TF_VAR_aws_secret_key }}
          TF_VAR_aws_access_key: ${{ secrets.TF_VAR_aws_access_key }}
          TF_VAR_proxy_auth_header: ${{ secrets.TF_VAR_proxy_auth_header }}
          TF_VAR_proxy_auth_value: ${{ secrets.TF_VAR_proxy_auth_value }}
          # ADR 032 / P042 — Cloudflare provider + worker module credentials.
          # Token requires Workers Scripts Edit + Workers Routes Edit + Workers
          # Secrets Edit scopes on the addressr account/zone. RapidAPI key is
          # the existing dashboard value (no rotation during the P042 cutover,
          # per ADR 032 Scope). Sourced via 1P Voder per reference_addressr_secrets.
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
          TF_VAR_cloudflare_pages_api_token: ${{ secrets.TF_VAR_cloudflare_pages_api_token }}
          TF_VAR_cloudflare_account_id: ${{ secrets.TF_VAR_cloudflare_account_id }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_cloudflare_zone_id }}
          TF_VAR_cloudflare_rapidapi_key: ${{ secrets.TF_VAR_cloudflare_rapidapi_key }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_CLOUD_TOKEN }}
        with:
          runCmd: |
            npm run deploy:prod
          env: |
            ADDRESSR_DEPLOY_JUST_PUBLISHED
            TF_IN_AUTOMATION=1
            TF_VAR_elasticapp=mountainpass-addressr
            TF_VAR_aws_secret_key
            TF_VAR_aws_access_key
            TF_VAR_proxy_auth_header
            TF_VAR_proxy_auth_value
            TF_VAR_cloudflare_api_token
            TF_VAR_cloudflare_pages_api_token
            TF_VAR_cloudflare_account_id
            TF_VAR_cloudflare_zone_id
            TF_VAR_cloudflare_rapidapi_key
            TF_TOKEN_app_terraform_io

      - name: Wait for deployment to stabilize
        if: success() && (steps.release-effects.outputs.api-published == 'true' || steps.deployment-version.outputs.changed == 'true')
        run: sleep 120

      - name: Smoke test production
        if: success() && (steps.release-effects.outputs.api-published == 'true' || steps.deployment-version.outputs.changed == 'true')
        run: |
          set -e
          echo "Testing health endpoint..."
          curl -sf --retry 3 --retry-delay 10 https://backend.addressr.io/health
          echo ""
          echo "Testing /api-docs is reachable without gateway auth (ADR 024 allowlist)..."
          curl -sf --retry 3 --retry-delay 10 -o /dev/null https://backend.addressr.io/api-docs
          echo ""

          # P035 / risk-scorer R3: /debug/shadow-config must be reachable
          # without gateway auth (ADR 024 allowlist) and must return the
          # documented JSON shape.
          #
          # READ THE POLARITY BEFORE EDITING. What "good" looks like here
          # INVERTS with whether a migration is in flight, and getting it
          # backwards is how P035 ran green for eight days:
          #   - shadow ENABLED (a migration is warming a green domain):
          #     hostSet MUST be true. false means the process cannot see
          #     ADDRESSR_SHADOW_HOST and is warming nothing — the silent no-op.
          #   - shadow DISABLED (steady state, no migration): hostSet MUST be
          #     false. true means we are mirroring a domain onto itself.
          # ADR 031 is the ledger of which posture is current. This block is
          # written for the DISABLED posture — see the assertion below.
          echo "P035 R3: probing /debug/shadow-config..."
          shadow_body=$(curl -sf --retry 3 --retry-delay 10 \
            https://backend.addressr.io/debug/shadow-config)
          echo "$shadow_body" | jq -e '.' > /dev/null || {
            echo "/debug/shadow-config did not return valid JSON"; exit 1;
          }
          # DISABLED posture. The ADR-041 cutover makes v4 (addressr6) the EB
          # primary and removes the read-shadow settings, so a shadow would now
          # be mirroring v4 onto itself. Assert hostSet=false — a stray
          # ADDRESSR_SHADOW_HOST surviving the cutover is a real misconfiguration
          # and should fail the deploy. Re-enable (and flip this assertion back
          # to true) at the next migration, when a new green domain needs warming.
          host_set=$(echo "$shadow_body" | jq -r '.hostSet')
          if [ "$host_set" != "false" ]; then
            echo "/debug/shadow-config hostSet=$host_set, expected false (read-shadow disabled — no migration in flight)"
            echo "body: $shadow_body"; exit 1
          fi
          # P035 BS-5 fix. This gate used to accept ANY member of the closed enum,
          # AuthError included — which is how the 2026-05-11 regression ran at a
          # 96.5% AuthError rate for eight days behind a green build. The only
          # acceptable state is a clean one: no failures and no last error at all,
          # so a 403 from a mis-wired IAM policy fails the deploy rather than
          # passing as a recognised error class.
          #
          # DORMANT IN THE DISABLED POSTURE, deliberately retained. With the host
          # unset, getShadowStatus returns failures:0 and lastError:null as
          # INITIALISED values (src/read-shadow.js), so both gates below pass
          # trivially and prove nothing right now. They are kept in place — not
          # deleted — so that re-enabling the shadow for the next migration
          # restores the BS-5 control by flipping one setting, with no risk of
          # someone forgetting to re-add the gate. Do not read a green smoke here
          # as evidence the shadow is healthy; while disabled there is no shadow.
          last_error_class=$(echo "$shadow_body" | jq -r '.lastError.class // "null"')
          if [ "$last_error_class" != "null" ]; then
            echo "/debug/shadow-config lastError.class=$last_error_class, expected null (P035 BS-5)"
            echo "body: $shadow_body"; exit 1
          fi
          failures=$(echo "$shadow_body" | jq -r '.failures // 0')
          if [ "$failures" != "0" ]; then
            echo "/debug/shadow-config failures=$failures, expected 0 (P035 BS-5)"
            echo "body: $shadow_body"; exit 1
          fi
          # successes>0 is reported, NOT gated. In the DISABLED posture it is
          # always 0 and that is correct — there is no shadow to mirror. It stays
          # here because it is the one field that answers "is it mirroring anything
          # at all" once the shadow is re-enabled, and even then it is unreliable
          # as a gate: it depends on real traffic landing in the deploy-to-smoke
          # window (the smoke's own calls never reach /addresses — the ADR 024
          # bypass probe returns 401 without searching), and counters are
          # cumulative-since-boot, so a single reading cannot prove liveness
          # (P035 BS-1). Mirror liveness was watched by the
          # addressr-v4-shadow-search-rate-floor alarm, which the ADR-041 cutover
          # removes along with the shadow itself. The v4 SearchableDocuments alarm
          # is NOT a substitute — it is a data-presence floor on the index, not a
          # check that anything is mirroring.
          successes=$(echo "$shadow_body" | jq -r '.successes // 0')
          echo "P035 R3 ok: hostSet=false (read-shadow disabled — no migration in flight), failures=0, lastError=null, successes=$successes"
          echo ""
          # ADR 024 bypass probe: direct-without-header must be rejected.
          # Any status other than 401 fails the release — enforcement is the
          # steady state (ADR 024 accepted, P009 closed).
          echo "Probing direct bypass (ADR 024 Confirmation criterion 5)..."
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://backend.addressr.io/addresses?q=sydney")
          if [ "$status" != "401" ]; then
            echo "direct probe returned $status, expected 401 (enforcement regression)"; exit 1
          fi
          echo "direct probe status 401 (expected)"

          # P040: Cloudflare Worker (ADR 018) auth boundary probes. These are
          # distinct from the ADR 024 origin probe above — the worker rejects
          # at a different layer with a different body shape. Probing both
          # makes a future regression that conflates the two layers loud.
          echo "Probing worker referer-accept (ADR 018 safeHosts allowlist)..."
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Referer: https://addressr.io/" \
            "https://api.addressr.io/addresses/GANSW718804790")
          if [ "$status" != "200" ]; then
            echo "worker probe with Referer returned $status, expected 200 (safeHosts allowlist regression — P040 workaround broken)"; exit 1
          fi
          echo "worker probe with Referer status 200 (expected)"

          echo "Probing worker no-referer rejection (ADR 018 default-deny)..."
          worker_body=$(curl -s "https://api.addressr.io/addresses/GANSW718804790")
          if ! echo "$worker_body" | grep -q "no-origin not permitted"; then
            echo "worker no-Referer probe did not return ADR 018 rejection body; got: $worker_body"
            echo "(this distinguishes the worker layer from the ADR 024 origin layer — body must start with 'no-origin not permitted')"
            exit 1
          fi
          echo "worker no-Referer rejection body matches ADR 018 (expected)"

          # ADR 025 / P007 ranking probes + P019 Link header rel probe: exact
          # street-level address must rank first when sub-unit variants share
          # the address; root / must advertise every rel in the contract.
          auth_header="${{ secrets.TF_VAR_proxy_auth_header }}: ${{ secrets.TF_VAR_proxy_auth_value }}"

          # P019: rel completeness on root /. The rel list is the HATEOAS
          # contract from test/resources/features/addressv2.feature:8-15 (ADR
          # 012). Root / requires ADR 024 auth, so we use $auth_header here.
          # This probe replaces the pre-ADR-024 "curl -sf /" line that was
          # latently broken under proxy-auth enforcement.
          echo "Probing root / Link header rel completeness (P019)..."
          link_header=$(curl -sf --retry 3 --retry-delay 10 -D - -o /dev/null \
            -H "$auth_header" https://backend.addressr.io/ \
            | grep -i '^link:' | tr -d '\r' || true)
          expected_rels=(
            "https://addressr.io/rels/address-search"
            "https://addressr.io/rels/locality-search"
            "https://addressr.io/rels/postcode-search"
            "https://addressr.io/rels/state-search"
            "https://addressr.io/rels/api-docs"
            "https://addressr.io/rels/health"
          )
          for rel in "${expected_rels[@]}"; do
            if ! echo "$link_header" | grep -qF "$rel"; then
              echo "root Link header missing rel: $rel"
              echo "actual link header: $link_header"
              exit 1
            fi
          done
          echo "root / Link header contains all ${#expected_rels[@]} expected rels."


          echo "Probing ranking for 278 ROSS RIVER RD AITKENVALE QLD 4814 (issue #375)..."
          top_sla=$(curl -sf --retry 3 --retry-delay 10 -H "$auth_header" \
            "https://backend.addressr.io/addresses?q=278%20ROSS%20RIVER%20RD%20AITKENVALE%20QLD%204814" \
            | jq -r '.[0].sla')
          if [[ "$top_sla" != "278 ROSS RIVER RD,"* ]]; then
            echo "ranking regression: expected top hit to start with '278 ROSS RIVER RD,', got '$top_sla'"
            exit 1
          fi
          echo "top hit '$top_sla' (street-level, expected)"

          echo "Probing ranking for 19 MURRAY RD CHRISTMAS ISLAND OT 6798..."
          top_sla=$(curl -sf --retry 3 --retry-delay 10 -H "$auth_header" \
            "https://backend.addressr.io/addresses?q=19%20MURRAY%20RD%20CHRISTMAS%20ISLAND%20OT%206798" \
            | jq -r '.[0].sla')
          if [[ "$top_sla" != "19 MURRAY RD, CHRISTMAS ISLAND OT 6798" ]]; then
            echo "ranking regression: expected top hit '19 MURRAY RD, CHRISTMAS ISLAND OT 6798', got '$top_sla'"
            exit 1
          fi
          echo "top hit '$top_sla' (street-level, expected)"

          echo "Smoke tests passed."

      # ADR-060: website delivery is a distinct release effect. A source push
      # merely updates the changesets release PR; only the merge commit that
      # consumes a website changeset changes the package version and enters
      # these steps.
      - name: Build website release
        if: success() && steps.website-version.outputs.changed == 'true'
        run: |
          npm run build -w @mountainpass/website
          printf '%s\n' "$GITHUB_SHA" > apps/website/public/revision.txt

      - name: Deploy website to Cloudflare Pages
        if: success() && steps.website-version.outputs.changed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.TF_VAR_cloudflare_account_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TF_VAR_cloudflare_pages_api_token }}
        run: >-
          npm exec -w @mountainpass/addressr-deployment -- wrangler pages deploy ../website/public
          --project-name=addressr
          --branch=master
          --commit-hash="$GITHUB_SHA"
          --commit-dirty=false

      - name: Smoke test website production revision
        if: success() && steps.website-version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            actual=$(curl -fsS "https://addressr.io/revision.txt?sha=$GITHUB_SHA" || true)
            if [ "$actual" = "$GITHUB_SHA" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::addressr.io is not serving release $GITHUB_SHA (got '$actual')"
              exit 1
            fi
            sleep 10
          done

          for route in / /quick-start/ /pricing/ /api-docs/; do
            curl -fsS --retry 3 --retry-delay 5 -o /dev/null "https://addressr.io$route?verify=$GITHUB_SHA"
          done
          curl -fsS --retry 3 --retry-delay 5 \
            -H 'Referer: https://addressr.io/' \
            'https://api.addressr.io/addresses?q=sydney' | jq -e 'length > 0' >/dev/null

      # TODO: RapidAPI OpenAPI spec sync is deferred — see ADR 023.
      # The REST provisioning API is defunct and the GitHub Action
      # has no tagged versions. /api-docs is live; for now, use the
      # "Import from URL" option in RapidAPI Studio pointing at
      # https://backend.addressr.io/api-docs when new endpoints are added.

  # ADR-040 stage 3, docker axis on the package-release path.
  #
  # @jtbd JTBD-400 (Ship Releases Reliably From Trunk — maintainer CI).
  # @jtbd JTBD-202 (Obtain and run the published Docker image — self-hosted
  #   operator). The operator-facing half — what the bare :<semver> tag promises
  #   a self-hoster who pins it — belongs to JTBD-202.
  #
  # This is the ONLY writer of the bare :<semver> tag. `publish_semver: true`
  # is what distinguishes a package release from every other caller of that
  # workflow, so a docker-only rebuild can never re-point a tag a self-hoster
  # has already pinned.
  #
  # There is no negated API-publication double-publish guard here, and none is
  # needed: docker-image.yml's own master push filter no longer lists
  # package.json, so a changesets release commit does not match it and this job
  # is the sole publisher on that commit. That is ADR-040 amendment option C.
  #
  # `!cancelled()` REPLACES GitHub's IMPLICIT `success()`, and that is the whole
  # point of it. ADR-040 recorded a Bad consequence here — the docker axis was
  # not independent of the deploy axis, because `needs: release` plus the
  # implicit success requirement put this job behind the npm publish AND the
  # deploy AND the prod smoke. It was accepted as benign because it "degrades to
  # today's manual `npm run docker:push`".
  #
  # It was realised on 2026-08-19 releasing 3.3.2. The publish succeeded; the
  # deploy failed on an EB instance npm-install; this job was skipped by the
  # implicit success(); and re-running could not recover it, because on a re-run
  # the changesets step has nothing left to consume and `api-published` is no
  # longer true. npm and production went to 3.3.2 and the registry stayed on 3.3.1.
  # And the break-glass that made it benign is withdrawn — registry pushes come
  # from the pipeline, not a laptop (ADR-050, user direction 2026-08-19).
  #
  # `!cancelled()` rather than `always()`: a cancelled run must not publish.
  #
  # THE POSITIVE `== 'true'` COMPARISON IS UNCHANGED and still load-bearing —
  # see the empty-string note below. Relaxing the implicit success() cannot let
  # this job run on a swallowed publish: the public-workspace assertion fails
  # when any expected npm version is absent, and this gate separately requires
  # the API package. A future reader will not re-derive that.
  #
  # THE UNPROVEN ASSUMPTION, both branches. This rests on `needs.release.outputs`
  # remaining readable when the release job fails at a LATER step than the one
  # that set them.
  #
  #   - If it does NOT hold: `api-published` is the empty string, `'' == 'true'` is
  #     false, the job skips — exactly today's behaviour. Safe, but SILENT: the
  #     next post-publish failure orphans another image and nothing says so.
  #     P108 tracks the missing assertion that would make it loud.
  #   - If it DOES hold: the image publishes on a failed release job. That is the
  #     point for a failed deploy. It also means a failed `Smoke test production`
  #     no longer holds the image back — accepted on ONE ground: `changeset
  #     publish` has already succeeded by then, so the same defect is already on
  #     npm under `latest` and already running in production. No substitute
  #     pre-release control is claimed. (An earlier version of this comment named
  #     `test:integration:search`; that was false — it resolves to one synthetic
  #     four-address analysis test and covers neither the rel-completeness nor
  #     the ranking probes.)
  #
  # Confirm on the next post-publish failure rather than assuming. Do NOT restate
  # this as "can only improve the outcome" — that is true only of the first
  # branch, and the behavioural delta lives entirely in the second.
  #
  # The gate is the POSITIVE `== 'true'` form, and that is load-bearing. When the
  # changesets step is skipped or publishes nothing this output resolves to the
  # empty string; `'' == 'true'` is false, so the job correctly does not run. The
  # empty-string trap bites the NEGATED `!= 'true'` form, not this one. (The
  # skipped case used to be a `deploy_only` dispatch; that input is retired, but
  # a deployment-only release reaches the same state — it publishes nothing
  # because the package is `private: true`.)
  docker-publish:
    needs: release
    if: "!cancelled() && needs.release.outputs.api-published == 'true'"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      publish_semver: true
