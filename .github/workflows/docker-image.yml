# Docker image build, smoke, and publish (P055 / ADR-039 / ADR-040 stage 2)
#
# @jtbd JTBD-400 (Ship Releases Reliably From Trunk — maintainer CI). The
#   operator-facing half of the tag contract — which tag to pin, what :latest
#   promises, how an operator learns the image changed — belongs to JTBD-202,
#   which does not exist yet; see P055. Prose reference only: an @jtbd
#   annotation for it would be a dangling ID. Deliberately NOT cited as
#   JTBD-200, which is the gateway auth boundary and cannot adjudicate a
#   container tag contract.
#
# Closes the gap ADR-013 carried as Open and ADR-039 inherits: the published
# mountainpass/addressr image was only ever built by a human running
# `npm run build:docker`, so a Dockerfile regression was invisible until a
# self-hoster hit it. This job builds it and proves the three properties the
# Distroless migration put at risk — the resolved CMD path actually boots with no
# shell to fall back on, the runtime user is still non-root, and the container
# terminates on SIGTERM.
#
# The SIGTERM step earned its keep on 2026-07-26: it caught the image being
# SIGKILLed at the grace deadline, because dumb-init had been dropped on the
# wrong belief that node-as-PID-1 handles signals. PID 1 gets no default signal
# dispositions from the kernel, so it does not. A tini init now runs as PID 1 and
# forwards SIGTERM to node. Do not weaken this step.
#
# It PUBLISHES, as of ADR-040 stage 2 — that decision is taken. The publish step
# is guarded twice, independently. It runs only on master and never on a pull
# request: on a same-repo pull request the secrets ARE available, so secret
# presence alone would not be a guard. And the secrets themselves must be
# non-empty; absent, the step prints a notice and succeeds, which is what let
# this wiring land before the user had added them. `npm run docker:push` is
# retained as the documented break-glass.
#
# The bare :<semver> tag is written only when the `publish_semver` input is true,
# i.e. only by a package release calling this workflow. A docker-only rebuild
# must never re-point a tag a self-hoster has already pinned.
#
# HEALTH_ES_PROBE=off is what lets the smoke run without an OpenSearch service
# container: /health then reports liveness only, which is exactly the property
# under test here. Search behaviour is covered by the cucumber suite in
# release.yml.
name: Docker Image

on:
  push:
    branches: [master]
    # ADR-040 stage 3, option C. package.json / package-lock.json are
    # DELIBERATELY ABSENT here while present on the pull_request filter below.
    # That asymmetry IS the double-publish guard — do not "re-sync the two
    # lists" as a tidy-up. A changesets release commit touches package.json;
    # with it here, that one commit would fire both this push trigger and
    # release.yml's workflow_call, publishing the image twice and RE-POINTING
    # the supposedly immutable :<version>-<gitsha>. What remains on master is a
    # true docker-only change. Pinned in
    # test/js/__tests__/docker-image-workflow.test.mjs.
    paths:
      - 'Dockerfile'
      - '.dockerignore.tmpl'
      - '.github/workflows/docker-image.yml'
  pull_request:
    # package.json / package-lock.json are here but NOT on the push filter
    # above: without them a dependency bump was publishable on merge without the
    # image ever having been built in the pull request. A pull request never
    # publishes, so keeping them here costs a build and buys verification.
    paths:
      - 'Dockerfile'
      - '.dockerignore.tmpl'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-image.yml'
  workflow_dispatch:
  # ADR-040: release.yml calls this at stage 3 with publish_semver: true.
  workflow_call:
    inputs:
      publish_semver:
        description: 'Also push the bare :<semver> tag. True only on a package release.'
        type: boolean
        default: false
    secrets:
      DOCKER_ID_USER:
        required: false
      DOCKER_ID_PASS:
        required: false

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    # Job scope, not workflow scope: in a called workflow `github.workflow`
    # resolves to the CALLER's name, so the old workflow-level
    # `${{ github.workflow }}-${{ github.ref }}` group would be byte-identical
    # to release.yml's own group at stage 3 and deadlock — the caller waiting
    # on the callee, the callee queued behind the caller.
    concurrency:
      group: docker-image-${{ github.ref }}
      cancel-in-progress: false
    env:
      # Job scope because build:docker and docker:push BOTH derive their tags
      # from scripts/docker-tags.sh, which reads this. At step scope the build
      # would tag two images and the push would try to push three.
      DOCKER_PUBLISH_SEMVER: ${{ inputs.publish_semver && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # prebuild:docker packs the tarball the Dockerfile COPYs in.
      - name: Build image
        run: npm run build:docker

      - name: Runtime user is non-root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' mountainpass/addressr:latest)
          echo "runtime user: ${user}"
          test "${user}" = 'nonroot' || test "${user}" = '65532:65532' || test "${user}" = '65532'

      - name: Container starts and serves /health
        run: |
          docker run -d --name addressr-smoke \
            -e PORT=8080 -e HEALTH_ES_PROBE=off \
            -p 8080:8080 mountainpass/addressr:latest
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo 'smoke request OK'
              exit 0
            fi
            sleep 2
          done
          echo '/health never answered — container logs follow:'
          docker logs addressr-smoke
          exit 1

      # tini is PID 1 and forwards SIGTERM to node. A container that ignores
      # SIGTERM is SIGKILLed at the 10s deadline, which is what happened when
      # node itself was PID 1. 10s is Docker's own grace contract, so the
      # threshold stays there rather than being tightened to flatter the fix.
      - name: Container stops on SIGTERM
        run: |
          start=$(date +%s)
          docker stop addressr-smoke > /dev/null
          elapsed=$(( $(date +%s) - start ))
          echo "stopped in ${elapsed}s"
          test "${elapsed}" -lt 10

      # No status function in the `if:`, so GitHub applies the implicit
      # success(): a failed build, /health, or SIGTERM step skips the publish.
      # That is ADR-039's compensating control for the floating :nonroot base —
      # the exact image that gets pushed is the one that was smoke-tested.
      - name: Publish image to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          DOCKER_ID_USER: ${{ secrets.DOCKER_ID_USER }}
          DOCKER_ID_PASS: ${{ secrets.DOCKER_ID_PASS }}
        run: |
          if [ -z "${DOCKER_ID_USER}" ] || [ -z "${DOCKER_ID_PASS}" ]; then
            echo '::notice::docker publish skipped: DOCKER_ID_USER not set'
            exit 0
          fi
          npm run docker:push

      - name: Show container logs on failure
        if: failure()
        run: docker logs addressr-smoke || true
