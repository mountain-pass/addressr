# @jtbd JTBD-400 (Ship Releases Reliably From Trunk)
#
# Read-only Terraform plan — pre-verify an infrastructure change before the act
# that applies it.
#
# PURPOSE RESTATED 2026-08-10, and this is a change of meaning rather than a
# tidy-up. This header read "pre-verify a `deploy/**` change before the push that
# applies it", because such a push fired a full production apply with no
# plan-approval gate in front of it. That axis is retired (ADR-001 and ADR-040,
# 2026-08-10 amendments; R021 retired), so there is no longer a push to get ahead
# of. What this pre-verifies now is a `deploy_only` dispatch.
#
# THAT MAKES IT MORE LOAD-BEARING, NOT LESS, and the point is easy to get
# backwards. With R021 retired this is the ONLY plan review left on any path to
# production: the two surviving entry points are a release-PR merge and a
# `deploy_only` dispatch, and neither shows an operator what the apply would
# change. R020 records a baseline dispatch here as the hand-performed stand-in
# for the approval gate R021 said the pipeline lacked — and R020 re-scored to 10
# on 2026-08-10 precisely because `deploy_only` became the sole infra-apply route
# while never having carried a real mutation. Run this before every
# `deploy_only`, not occasionally.
#
# The other half of the original reason is unchanged and still decisive: the root
# module's variables come from GitHub Actions secrets, so `terraform plan` cannot
# run on an operator machine at all — which makes pre-verification impossible
# rather than merely inconvenient without this workflow.
#
# Reading the changed files is not a substitute. `apply` refreshes and
# reconciles the WHOLE root module, so an Elastic Beanstalk change can arise
# from drift with nothing to do with your diff: a managed-platform update
# against the pinned solution_stack_name, console-side mutation, ASG drift.
# Only a plan answers "will this bounce the fleet?"
#
# Not theoretical: applying mid-soak would bounce the EB fleet at ADR-004's
# BatchSize=100% with no traffic ramp, resetting the cumulative-since-boot
# read-shadow counters (P035 BS-1) and invalidating a multi-day soak window —
# the soak that gates the ADR-041 cutover for P069 (issue #365).
#
# DISPATCH-ONLY, for two reasons, the second decisive:
#   1. The TFC workspace is remote-state / local-execution, so `terraform plan`
#      takes the workspace lock and would contend with an in-flight release.
#   2. A fork pull_request receives NO secrets, so every TF_VAR_* resolves to
#      empty. That is not a failed plan, it is a confidently wrong one: the
#      proxy-auth pair both default to "", main.tf's precondition passes on the
#      empty pair, and the plan renders as tearing down the ADR-024 enforcement
#      boundary — from a green run. `pull_request_target` is categorically off
#      the table: it would hand fork-authored code the production AWS keys.
# To plan a change that is not yet on master, dispatch this against a
# short-lived branch — release.yml's auto-apply is gated on `master` both by its
# push trigger and by a job-level ref check, so it will not fire.
#
# WHAT IT CAN AND CANNOT TELL YOU — NARROWED 2026-08-09, do not read the old
# form. The caveat here used to say `aws_s3_object.elasticapp` had no
# `etag`/`source_hash`, so Terraform diffed only the key/source strings and this
# workflow was structurally blind to the bundle's contents. That was P095's open
# task and it is now closed: the object carries a `source_hash` over the
# deployment manifest, so a manifest that disagrees with the version in its own
# name produces a plan diff.
#
# What that buys, precisely: the plan now detects that the bundle's INPUT
# changed. What it still does not prove is that the uploaded artefact was built
# from that input — the hash is over `deployment/package.json`, not over the zip,
# because the zip carries mtimes and hashing it would diff on every run. So a
# green plan means the manifest is the one this ref would generate; it does not
# certify the archive's bytes. `deploy.sh` closes the practical gap by rebuilding
# the bundle directory from empty and failing closed if `zip` fails, rather than
# by anything Terraform can see.
#
# A DIFFERENT caveat that used to sit here is RETIRED as of 2026-08-08 (P095 /
# ADR-040 amendment): dispatching while package.json differed from the deployed
# version used to show EB churn that was an artefact of WHEN you dispatched
# rather than of your change. deploy.sh now resolves the version the same way on
# the plan path and the apply path, so that artefact is gone. Do not read the
# retirement as applying to the blindness caveat above it.
name: Terraform Plan (read-only)

on:
  workflow_dispatch:
    inputs:
      expect_only:
        description: >
          Optional. Comma-separated Terraform resource addresses the plan is
          allowed to change; the job FAILS if it changes anything else. Leave
          EMPTY for a baseline run that reports the plan and asserts nothing —
          do that first, to establish the real steady-state change set before
          trusting an assertion.
        required: false
        type: string

# Ref-INDEPENDENT on purpose. release.yml runs only on master, so its group is
# always `Release-refs/heads/master`. Interpolating github.ref here would match
# that only when the plan is dispatched on master — and on a short-lived branch,
# which is the path this workflow documents as the recommended one, it would form
# its own group and lose the protection entirely. Local execution means a plan
# takes the TFC workspace lock, so a plan racing an apply fails on a locked
# workspace and would be meaningless anyway. release.yml sets no
# cancel-in-progress, so this queues rather than cancels.
concurrency: Release-refs/heads/master

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npx npm@10 ci

      # FAIL-CLOSED PRECONDITION. `npm run deploy:plan` sets PLAN_ONLY=1, but that
      # only means anything if the CHECKED-OUT ref's deploy.sh honours it. On a
      # ref without the PLAN_ONLY branch the variable is simply unread and
      # control falls through to `terraform apply -auto-approve` — this workflow
      # would APPLY to production while calling itself read-only.
      #
      # That is not hypothetical: it was the exact state of master during the
      # window between landing this workflow and landing deploy.sh's guard. A
      # guard must land before or with its caller, never after.
      #
      # Keep this step even once every ref has the branch. Dispatch takes an
      # arbitrary ref, including old ones, and this is the only thing standing
      # between a mis-selected ref and a production apply.
      - name: Refuse to run against a ref whose deploy.sh would apply
        run: |
          set -euo pipefail
          if ! grep -q 'PLAN_ONLY' deploy/deploy.sh; then
            echo "::error::This ref's deploy/deploy.sh has no PLAN_ONLY branch."
            echo "::error::Running it would TERRAFORM APPLY to production, not plan."
            exit 1
          fi
          echo "OK — this ref's deploy.sh honours PLAN_ONLY."

      # Mirrors release.yml's Deploy step exactly — same devcontainer, same var
      # set, same TFC token. A plan run under different inputs than the apply
      # answers a different question and would be worse than no plan. Pinned in
      # test/js/__tests__/terraform-plan-workflow.test.mjs so it cannot drift.
      - name: Terraform plan (no apply)
        uses: devcontainers/ci@v0.3
        env:
          TF_VAR_aws_secret_key: ${{ secrets.TF_VAR_aws_secret_key }}
          TF_VAR_aws_access_key: ${{ secrets.TF_VAR_aws_access_key }}
          TF_VAR_proxy_auth_header: ${{ secrets.TF_VAR_proxy_auth_header }}
          TF_VAR_proxy_auth_value: ${{ secrets.TF_VAR_proxy_auth_value }}
          TF_VAR_cloudflare_api_token: ${{ secrets.TF_VAR_cloudflare_api_token }}
          TF_VAR_cloudflare_account_id: ${{ secrets.TF_VAR_cloudflare_account_id }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.TF_VAR_cloudflare_zone_id }}
          TF_VAR_cloudflare_rapidapi_key: ${{ secrets.TF_VAR_cloudflare_rapidapi_key }}
          TF_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_CLOUD_TOKEN }}
        with:
          runCmd: |
            npm run deploy:plan
          env: |
            TF_IN_AUTOMATION=1
            TF_WORKSPACE=prod
            TF_VAR_elasticapp=mountainpass-addressr
            TF_VAR_aws_secret_key
            TF_VAR_aws_access_key
            TF_VAR_proxy_auth_header
            TF_VAR_proxy_auth_value
            TF_VAR_cloudflare_api_token
            TF_VAR_cloudflare_account_id
            TF_VAR_cloudflare_zone_id
            TF_VAR_cloudflare_rapidapi_key
            TF_TOKEN_app_terraform_io

      # WHITELIST projection, never a redaction of the full document. `terraform
      # show -json` emits every root variable value in CLEARTEXT — sensitive=true
      # flags but does not redact — so the raw plan must never leave the runner
      # on a public repo. Address + action verbs is exactly what "what does this
      # touch?" needs and carries no attribute values. A whitelist cannot fail
      # open when a new sensitive variable is added to the root module.
      - name: Project the plan to addresses and actions
        if: always()
        run: |
          set -euo pipefail
          test -f deploy/tfplan.json || { echo "::error::no plan JSON produced"; exit 1; }
          jq '[.resource_changes[]?
               | select(.change.actions | any(. == "create" or . == "update" or . == "delete"))
               | {address, actions: .change.actions}]' \
            deploy/tfplan.json > "$RUNNER_TEMP/plan-summary.json"
          echo "--- resources this plan would change ---"
          jq -r '.[] | "\(.actions | join(",")) \(.address)"' "$RUNNER_TEMP/plan-summary.json"

      # Empty expect_only means "baseline run, assert nothing" — deliberate, so a
      # blank input is never mistaken for a silent skip. Run it that way first.
      - name: Assert the plan changes only what was expected
        if: inputs.expect_only != ''
        run: |
          set -euo pipefail
          actual=$(jq -r '.[].address' "$RUNNER_TEMP/plan-summary.json" | sort)
          expected=$(printf '%s' "${{ inputs.expect_only }}" \
            | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | sort)

          echo "--- would change ---"; echo "${actual:-(nothing)}"
          echo "--- allowed ---";      echo "$expected"

          unexpected=$(comm -23 \
            <(printf '%s\n' "$actual" | grep -v '^$' || true) \
            <(printf '%s\n' "$expected"))
          if [ -n "$unexpected" ]; then
            echo "::error::plan changes resources outside the allowed set:"
            echo "$unexpected"
            exit 1
          fi
          echo "OK — plan is within the allowed set."

      - name: Upload plan summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan-summary
          path: ${{ runner.temp }}/plan-summary.json
          retention-days: 7
          if-no-files-found: warn
