# Perf regression detection (P032 / RFC-007)
#
# @jtbd JTBD-001 (Search and Autocomplete — defends the "results within 200 ms"
#   outcome) via JTBD-400 (Ship Releases Reliably From Trunk — maintainer CI).
#
# A SEPARATE workflow from release.yml on purpose: it runs on a decoupled
# cadence (nightly + on-demand), NOT per-push and NOT in the build-and-test
# matrix. Folding OpenSearch spin-up + fixture load + build + a 60 s k6 run into
# every push would slow the trunk-based release loop; the release gate stays on
# correctness (cucumber) only. The probe DISCRIMINATES on k6's exit code: a
# threshold breach (99) is ADVISORY — a ::warning:: plus a job-summary entry on
# an otherwise green run, never a red master or a blocked release — while any
# other nonzero exit means k6 itself failed to run and FAILS the job loudly.
# Note the asymmetry: a probe that RUNS but measures the wrong thing still
# breaches checks{phase:main} and lands in the ADVISORY branch — see the P032
# residual. Run the probe locally with `npm run test:perf:regression` before a
# risky merge.
name: Perf Regression

on:
  workflow_dispatch:
  schedule:
    # 14:30 UTC nightly (~00:30 AEST) — off-peak, avoids the release workflow.
    - cron: '30 14 * * *'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  perf-regression:
    runs-on: ubuntu-latest
    services:
      opensearch:
        # Single engine = production (3.5.0). The 2.19 leg in release.yml exists
        # for cross-version behavioural compat, not perf; perf is a wall-clock
        # trend on the engine prod actually runs.
        image: opensearchproject/opensearch:3.5.0
        env:
          discovery.type: single-node
          ES_JAVA_OPTS: '-Xms1g -Xmx1g'
          plugins.security.disabled: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-
      - name: Install dependencies
        run: npm ci
      - name: Generate version file
        # loader.js / server2.js printVersion() import ./version.js.
        run: npm run genversion
      - name: Cache G-NAF zip
        uses: actions/cache@v6
        id: gnaf-cache
        with:
          path: target/gnaf/*.zip
          key: gnaf-zip-${{ hashFiles('service/address-service.js') }}
          restore-keys: |
            gnaf-zip-
      - name: Prepare OT test fixture
        run: |
          # Same slim-OT-fixture prep as release.yml build-and-test.
          if [ ! -f target/gnaf/*.zip ]; then
            node --input-type=module -e "
              const { fetchGnafFile } = await import('./service/address-service.js');
              console.log('Downloaded:', await fetchGnafFile());
            "
          fi
          GNAF_ZIP=$(ls target/gnaf/*.zip | head -1)
          FIXTURE_DIR=target/gnaf-fixture
          mkdir -p "$FIXTURE_DIR"
          unzip -o -j "$GNAF_ZIP" '*/Authority Code/*' -d "$FIXTURE_DIR/Authority Code/" 2>/dev/null || true
          unzip -o -j "$GNAF_ZIP" '*/Standard/OT_*' -d "$FIXTURE_DIR/Standard/" 2>/dev/null || true
          echo "Fixture contents:"
          find "$FIXTURE_DIR" -type f | head -20
      - name: Load OT fixture into OpenSearch
        env:
          GNAF_TEST_FIXTURE_DIR: target/gnaf-fixture
          ES_INDEX_NAME: ot
          COVERED_STATES: OT
          DEBUG: error,api,es
        # ELASTIC_HOST defaults to 127.0.0.1:9200 (the service container).
        # Native ESM since ADR-044: node runs the source directly, same as the
        # cucumber pretest hooks in release.yml. No build, no loader hook.
        run: node loader.js
      - name: Start Addressr API server
        env:
          ES_INDEX_NAME: ot
          PORT: '6060'
          DEBUG: error,api,es
        run: |
          node src/server2.js &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for /health (on the ADR 024 no-auth allowlist) to come up.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6060/health > /dev/null; then
              echo "server up after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "server did not become healthy on :6060"; exit 1
      - name: Install k6
        uses: grafana/setup-k6-action@v1
      - name: Run perf regression probe
        id: k6
        # EXIT-CODE DISCRIMINATION (supersedes the blanket step-level failure
        # tolerance that shipped 2026-07-25). k6's exit code is the router:
        #   0  -> every threshold passed. Step succeeds.
        #   99 -> a threshold was crossed = a real perf breach. ADVISORY: a
        #         ::warning:: plus a job-summary entry, step still exits 0. A
        #         perf breach must never redden master or stall the trunk loop.
        #   *  -> k6 itself failed to run — binary missing, script would not
        #         parse, panic/OOM, log write failed. That is a BROKEN PROBE,
        #         not a measurement. Fail loudly; the blanket tolerance this
        #         replaces hid exactly this class.
        #
        # KNOWN RESIDUAL (P032): a probe that RUNS but measures the WRONG thing
        # still exits 99, via the checks{phase:main} rate threshold — so the
        # 2026-07-25 breakage would land in the advisory branch. Separating
        # validity from latency needs summary-content inspection, not $?.
        #
        # `shell: bash` is load-bearing for PIPESTATUS (arrays do not exist in
        # dash), and `set +e` is MANDATORY: GitHub runs this as
        # `bash --noprofile --norc -eo pipefail`, so without it the pipeline
        # returns 99 and -e aborts the script before `rc` is ever read. Do not
        # tidy the `set +e` away.
        shell: bash
        run: |
          mkdir -p target
          set +e
          npm run test:perf:regression 2>&1 | tee target/perf-regression.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "k6_exit=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0)
              echo "perf regression probe passed every threshold"
              ;;
            99)
              echo "::warning::Perf regression probe crossed a k6 threshold (advisory only — this does not fail the build). See the job summary for threshold detail."
              ;;
            *)
              echo "::error::Perf regression probe FAILED TO RUN (k6 exit $rc). This is a broken probe, not a perf regression — the nightly perf signal is invalid until it is fixed."
              exit 1
              ;;
          esac
          exit 0
      - name: Report perf regression result
        if: always()
        shell: bash
        # Keyed on the exit code the probe step published, NOT on the step
        # result: under discrimination a breach exits 0, so the step result is
        # `success` for both a clean run and an advisory breach.
        env:
          K6_EXIT: ${{ steps.k6.outputs.k6_exit }}
        run: |
          rc="${K6_EXIT:-}"
          # `|| true` is load-bearing: an assignment from a command
          # substitution propagates its exit status, so a missing log (sed
          # exits 2) would kill this step under errexit — on exactly the
          # cancelled/early-failure runs where `if: always()` put us here.
          summary=$(sed -n '/THRESHOLDS/,$p' target/perf-regression.log 2>/dev/null || true)
          {
            echo "## Perf regression probe (breach = advisory, broken probe = failure)"
            echo ""
            echo "k6 exit code: \`${rc:-unknown}\`"
            echo ""
            case "$rc" in
              0) echo "All thresholds passed." ;;
              99) echo "**Threshold breach (advisory).** A k6 threshold was crossed. This does not fail the build — see P032 for why a perf breach stays advisory." ;;
              '') echo "**No exit code published** — the probe step never ran, or the job was cancelled." ;;
              *) echo "**Broken probe (job failed).** k6 exited \`$rc\`, which is not a threshold breach — this run measured nothing usable." ;;
            esac
            echo ""
            echo '```'
            if [ -n "$summary" ]; then
              printf '%s\n' "$summary"
            else
              echo "(no k6 threshold summary in the log — the probe likely never reached the summary phase; see the probe step log)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Stop Addressr API server
        if: always()
        run: '[ -n "$SERVER_PID" ] && kill "$SERVER_PID" || true'
